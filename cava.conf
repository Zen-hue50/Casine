# casine's private cava config (raw output for casine to read; your normal cava config is untouched)

[general]
framerate = 60
bars = 64

[input]
method = pulse
source = auto

[output]
method = raw
channels = mono
mono_option = average
reverse = 0
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000          # must match raw_max in casine.ini
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 25            # casine does its own smoothing, so keep this low
monstercat = 0
waves = 0
gravity = 120

[eq]
1 = 0.8
2 = 0.9
3 = 1.0
4 = 1.1
5 = 1.2
